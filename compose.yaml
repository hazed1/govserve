services:
  # 1. Database Service (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: govcheck-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: govcheck_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govcheck-backend-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/govcheck_db
    depends_on:
      - postgres

  # 3. Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build # Gagamitin ang build stage na may kumpletong node_modules
    container_name: govcheck-frontend-app
    restart: always
    user: "0:0"
    ports:
      - "5173:5173"
      - "4173:4173"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules # Pinoprotektahan ang container dependencies laban sa host
    depends_on:
      - backend

volumes:
  postgres_data: